[package]
name = "seo-brain"
version = "0.1.0"
edition = "2021"
description = "SEO Brain desktop shell"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "seo_brain_lib"
crate-type = ["lib", "cdylib", "staticlib"]
