<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SEO Brain</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: #0b0f14; color: #d7e4ea;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .box { max-width: 520px; padding: 32px; text-align: center; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 18px; }
      .spin {
        width: 28px; height: 28px; margin: 0 auto 18px; border-radius: 50%;
        border: 3px solid #1f2a36; border-top-color: #4cc9f0; animation: r 0.9s linear infinite;
      }
      @keyframes r { to { transform: rotate(360deg); } }
      #status { color: #9db3be; margin: 0; }
      #detail { color: #7c929d; font-size: 13px; margin-top: 14px; word-break: break-all; }
      body.failed .spin { display: none; }
      body.failed #status { color: #ff8a8a; }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin" aria-hidden="true"></div>
      <h1>SEO Brain</h1>
      <p id="status">Starting the local database and API. The first launch takes longer.</p>
      <p id="detail"></p>
    </div>
    <script>
      // Called from the Rust shell while the API starts.
      window.__status = (text) => { document.getElementById('status').textContent = text; };
      window.__fail = (text, detail) => {
        document.body.classList.add('failed');
        document.getElementById('status').textContent = text;
        document.getElementById('detail').textContent = detail || '';
      };
    </script>
  </body>
</html>
