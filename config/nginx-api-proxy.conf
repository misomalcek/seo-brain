# Brain API Proxy Configuration
# Add this to the server block in /etc/nginx/sites-enabled/default
# After adding, run: sudo nginx -t && sudo systemctl reload nginx

# API proxy to Node.js backend
location /api/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE streaming support
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    # Timeouts for streaming
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Static chat app (served from out/ directory)
location /apps/brain-chat/ {
    alias /var/www/brain/apps/brain-chat/out/;
    try_files $uri $uri/ /apps/brain-chat/index.html;
}
